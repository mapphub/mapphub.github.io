name: Mirror apps www
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror all apps into apps/{id}/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mirror_one() {
            local REPO="$1" ID="$2"
            echo "=== $REPO → apps/$ID ==="
            rm -rf /tmp/src /tmp/clone
            mkdir -p /tmp/src
            if git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/mapphub/${REPO}.git" gh-pages | grep -q gh-pages; then
              git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/mapphub/${REPO}.git" /tmp/src
              rm -rf /tmp/src/.git
            else
              git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/mapphub/${REPO}.git" /tmp/clone
              cp -a /tmp/clone/mapp/public/. /tmp/src/
            fi
            mkdir -p "apps/${ID}"
            find "apps/${ID}" -mindepth 1 -delete 2>/dev/null || true
            cp -a /tmp/src/. "apps/${ID}/"
            test -f "apps/${ID}/index.html"
          }
          mirror_one app-market market
          mirror_one app-editor editor
          mirror_one app-chat chat
          mirror_one app-fileshare fileshare
          mirror_one app-slides slides

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name mapphub-bot
          git config user.email bot@mapphub.local
          git add apps/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "mirror: apps www from gh-pages/mapp.public"
            git push
          fi
